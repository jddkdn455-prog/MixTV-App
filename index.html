<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MixTV - المباشر والترفيه</title>
    <!-- مكتبة تشغيل بث HLS المشفرة والحديثة -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f0f0f; color: #fff; padding-bottom: 50px; }
        
        /* الهيدر والمشغل */
        header { background: #1a1a1a; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; color: #e50914; border-bottom: 2px solid #e50914; }
        .player-container { width: 100%; max-width: 800px; margin: 0 auto; background: #000; aspect-ratio: 16/9; }
        video { width: 100%; height: 100%; }

        /* أقسام المحتوى */
        .section-title { margin: 20px 15px 10px; font-size: 18px; color: #e50914; border-right: 4px solid #e50914; padding-right: 8px; }
        
        /* شبكة الكروت (القنوات والمباريات) */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding: 0 15px; }
        .card { background: #1f1f1f; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; border: 1px solid #333; transition: 0.2s; }
        .card:hover { border-color: #e50914; transform: translateY(-3px); }
        .card img { width: 100%; height: 80px; object-fit: contain; margin-bottom: 8px; }
        .card p { font-size: 13px; color: #ddd; }
        
        /* جدول المباريات */
        .match-card { background: #1a1a1a; border-radius: 8px; padding: 12px; margin: 0 15px 10px; display: flex; justify-content: space-between; align-items: center; border-right: 3px solid #e50914; }
        .team { font-weight: bold; font-size: 14px; }
        .time { background: #e50914; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

    <header>MixTV 📺</header>

    <!-- شاشة مشغل الفيديو المباشر -->
    <div class="player-container">
        <video id="videoPlayer" controls autoplay poster="https://via.placeholder.com/800x450/000000/FFFFFF?text=اختر+قناة+للبث+المباشر"></video>
    </div>

    <!-- قسم مباريات اليوم -->
    <div class="section-title">مباريات اليوم المباشرة</div>
    <div id="matchesContainer">
        <div class="match-card" onclick="playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
            <span class="team">الأهلي vs الزمالك</span>
            <span class="time">8:00 مساءً</span>
        </div>
    </div>

    <!-- قسم قنوات beIN Sports -->
    <div class="section-title">قنوات beIN Sports</div>
    <div class="grid">
        <div class="card" onclick="playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
            <img src="https://via.placeholder.com/100x100/e50914/FFFFFF?text=beIN+1" alt="beIN 1">
            <p>beIN Sports 1 HD</p>
        </div>
        <div class="card" onclick="playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
            <img src="https://via.placeholder.com/100x100/e50914/FFFFFF?text=beIN+2" alt="beIN 2">
            <p>beIN Sports 2 HD</p>
        </div>
    </div>

    <script>
        // دالة تشغيل السيرفرات والبث المباشر
        function playStream(url) {
            var video = document.getElementById('videoPlayer');
            if (Hls.isSupported()) {
                var hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play();
            }
        }
    </script>
</body>
          </html>
