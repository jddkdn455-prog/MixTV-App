<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MixTV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding-bottom: 70px;
    }
    header {
      background: #1f1f1f;
      padding: 12px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #e50914;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .player-container {
      width: 100%;
      background: #000;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    video {
      width: 100%;
      max-height: 230px;
      display: block;
    }
    .controls-bar {
      background: #1a1a1a;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    .quality-select {
      background: #2b2b2b;
      color: #fff;
      border: 1px solid #444;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 12px;
    }
    .content { padding: 15px; }
    .section { display: none; }
    .section.active { display: block; }
    h2 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #e50914;
      border-right: 3px solid #e50914;
      padding-right: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
    }
    .card {
      background: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
      text-align: center;
      padding: 10px;
      border: 1px solid #2a2a2a;
      cursor: pointer;
    }
    .card:active { background: #e50914; }
    .card-title { font-size: 13px; margin-top: 5px; font-weight: bold; }
    
    /* Navigation Bar */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1f1f1f;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid #2a2a2a;
    }
    nav button {
      background: none;
      border: none;
      color: #aaa;
      font-size: 12px;
      cursor: pointer;
    }
    nav button.active { color: #e50914; font-weight: bold; }
  </style>
</head>
<body>

  <header>📺 MixTV</header>

  <div class="player-container">
    <video id="video" controls autoplay></video>
    <div class="controls-bar">
      <span style="font-size: 12px; color: #ccc;" id="channel-name">اختر قناة للعرض</span>
      <select id="qualitySelect" class="quality-select" onchange="changeQuality(this.value)">
        <option value="-1">الجودة: تلقائي</option>
      </select>
    </div>
  </div>

  <div class="content">
    <!-- قسم المباريات -->
    <div id="matches" class="section active">
      <h2>📅 مباريات اليوم</h2>
      <div class="grid">
        <div class="card" onclick="playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', 'مباراة 1')">
          <div class="card-title">مباراة تجريبية 1</div>
        </div>
        <div class="card" onclick="playStream('https://res.cloudinary.com/demo/video/upload/sp_auto/v1556211757/mountain.m3u8', 'مباراة 2')">
          <div class="card-title">مباراة تجريبية 2</div>
        </div>
      </div>
    </div>

    <!-- قسم beIN Sports -->
    <div id="bein" class="section">
      <h2>📡 قنوات beIN Sports</h2>
      <div class="grid">
        <div class="card" onclick="playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', 'beIN 1')">
          <div class="card-title">beIN Sports 1</div>
        </div>
      </div>
    </div>

    <!-- قسم الأفلام -->
    <div id="movies" class="section">
      <h2>🎬 الأفلام</h2>
      <div class="grid">
        <div class="card" onclick="playStream('https://res.cloudinary.com/demo/video/upload/sp_auto/v1556211757/mountain.m3u8', 'فيلم تجريبي')">
          <div class="card-title">فيلم تجريبي</div>
        </div>
      </div>
    </div>

    <!-- قسم المسلسلات -->
    <div id="series" class="section">
      <h2>📺 المسلسلات</h2>
      <div class="grid">
        <div class="card" onclick="playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', 'مسلسل تجريبي')">
          <div class="card-title">مسلسل تجريبي</div>
        </div>
      </div>
    </div>
  </div>

  <!-- الشريط السفلي -->
  <nav>
    <button class="active" onclick="showTab('matches', this)">المباريات</button>
    <button onclick="showTab('bein', this)">beIN Sports</button>
    <button onclick="showTab('movies', this)">الأفلام</button>
    <button onclick="showTab('series', this)">المسلسلات</button>
  </nav>

  <script>
    const video = document.getElementById('video');
    const qualitySelect = document.getElementById('qualitySelect');
    let hlsInstance = null;

    function playStream(url, name) {
      document.getElementById('channel-name').innerText = "جاري عرض: " + name;
      
      if (hlsInstance) {
        hlsInstance.destroy();
      }

      if (Hls.isSupported()) {
        hlsInstance = new Hls();
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
        
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
          video.play();
          updateQualityLevels();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
      }
    }

    function updateQualityLevels() {
      qualitySelect.innerHTML = '<option value="-1">الجودة: تلقائي</option>';
      if (hlsInstance && hlsInstance.levels.length > 0) {
        hlsInstance.levels.forEach((level, index) => {
          const option = document.createElement('option');
          option.value = index;
          option.text = level.height + 'p';
          qualitySelect.appendChild(option);
        });
      }
    }

    function changeQuality(levelIndex) {
      if (hlsInstance) {
        hlsInstance.currentLevel = parseInt(levelIndex);
      }
    }

    function showTab(tabId, btn) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }
  </script>
</body>
  </html>
