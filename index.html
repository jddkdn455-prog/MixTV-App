<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>MixTV</title>

  <link
    href="https://vjs.zencdn.net/8.23.4/video-js.css"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #07090d;
      --bg-2: #0d1118;
      --surface: #111720;
      --surface-2: #171e29;
      --surface-3: #202a38;
      --text: #f5f7fa;
      --muted: #8d98a8;
      --primary: #e50914;
      --primary-2: #ff2631;
      --green: #22c55e;
      --border: rgba(255,255,255,.08);
      --shadow: 0 16px 50px rgba(0,0,0,.35);
      --radius: 14px;
      --nav-height: 70px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 80% 0%, rgba(229,9,20,.08), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app {
      min-height: 100vh;
      padding-bottom: calc(var(--nav-height) + 20px);
    }

    /* =========================
       HEADER
    ========================== */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      background: rgba(7,9,13,.86);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -.5px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--primary), #8b0008);
      box-shadow: 0 8px 25px rgba(229,9,20,.25);
    }

    .brand-mark::after {
      content: "▶";
      font-size: 14px;
      margin-right: -2px;
    }

    .brand span {
      color: var(--primary-2);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface);
      color: var(--text);
      display: grid;
      place-items: center;
      transition: .2s;
    }

    .icon-btn:hover {
      background: var(--surface-3);
      transform: translateY(-1px);
    }

    /* =========================
       PAGES
    ========================== */

    .page {
      display: none;
      min-height: calc(100vh - 66px);
    }

    .page.active {
      display: block;
      animation: pageIn .25s ease;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .container {
      width: min(1400px, 92%);
      margin: auto;
    }

    /* =========================
       HERO
    ========================== */

    .hero {
      position: relative;
      min-height: 510px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          90deg,
          rgba(7,9,13,.98) 0%,
          rgba(7,9,13,.76) 38%,
          rgba(7,9,13,.22) 100%
        ),
        linear-gradient(
          0deg,
          var(--bg) 0%,
          transparent 55%
        ),
        url("https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=1800&q=85")
        center/cover;
      transform: scale(1.01);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: min(1400px, 92%);
      margin: 0 auto;
      padding: 70px 0;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 14px;
      color: #ff6670;
      font-weight: 800;
      font-size: 13px;
    }

    .hero-kicker::before {
      content: "";
      width: 7px;
      height: 7px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--primary);
    }

    .hero h1 {
      max-width: 620px;
      font-size: clamp(38px, 6vw, 76px);
      line-height: .98;
      letter-spacing: -2px;
      margin-bottom: 18px;
    }

    .hero-description {
      max-width: 570px;
      color: #c5ccd6;
      line-height: 1.8;
      font-size: 15px;
      margin-bottom: 25px;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 25px;
    }

    .meta-pill {
      padding: 7px 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      border-radius: 8px;
      font-size: 12px;
      color: #dce1e8;
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .primary-btn,
    .secondary-btn {
      border: 0;
      border-radius: 9px;
      padding: 12px 19px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: .2s;
    }

    .primary-btn {
      color: white;
      background: var(--primary);
      box-shadow: 0 10px 30px rgba(229,9,20,.2);
    }

    .primary-btn:hover {
      background: var(--primary-2);
      transform: translateY(-2px);
    }

    .secondary-btn {
      color: var(--text);
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.08);
    }

    .secondary-btn:hover {
      background: rgba(255,255,255,.15);
    }

    /* =========================
       SECTIONS
    ========================== */

    .content-section {
      padding: 35px 0 5px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 17px;
    }

    .section-title {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -.3px;
    }

    .section-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 20px;
      background: var(--primary);
      border-radius: 10px;
      margin-left: 9px;
      vertical-align: -3px;
    }

    .view-all {
      color: var(--muted);
      font-size: 13px;
    }

    .view-all:hover {
      color: white;
    }

    /* =========================
       CARDS
    ========================== */

    .cards {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 13px;
    }

    .card {
      position: relative;
      min-width: 0;
      cursor: pointer;
      transition: transform .2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .poster {
      position: relative;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      border-radius: 11px;
      background: var(--surface);
      box-shadow: 0 8px 25px rgba(0,0,0,.2);
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .35s ease;
    }

    .card:hover .poster img {
      transform: scale(1.05);
    }

    .poster::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(0,0,0,.7), transparent 45%);
      pointer-events: none;
    }

    .rating {
      position: absolute;
      z-index: 2;
      top: 8px;
      right: 8px;
      padding: 4px 7px;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(5px);
      border-radius: 6px;
      color: #ffd166;
      font-size: 11px;
      font-weight: 800;
    }

    .card-fav {
      position: absolute;
      z-index: 3;
      top: 8px;
      left: 8px;
      width: 29px;
      height: 29px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.65);
      color: white;
      display: grid;
      place-items: center;
    }

    .card-fav.active {
      color: #ff3d4d;
    }

    .card-info {
      padding: 9px 2px 0;
    }

    .card-title {
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-sub {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    /* =========================
       CATEGORY CHIPS
    ========================== */

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      color: #aeb8c6;
      background: var(--surface);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      transition: .2s;
    }

    .chip.active,
    .chip:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    /* =========================
       SEARCH
    ========================== */

    .search-page {
      padding: 35px 0;
    }

    .search-box {
      position: relative;
      margin-bottom: 22px;
    }

    .search-box input {
      width: 100%;
      height: 54px;
      padding: 0 50px 0 18px;
      background: var(--surface);
      color: white;
      border: 1px solid var(--border);
      outline: none;
      border-radius: 12px;
      font-size: 15px;
    }

    .search-box input:focus {
      border-color: rgba(229,9,20,.6);
      box-shadow: 0 0 0 3px rgba(229,9,20,.08);
    }

    .search-icon {
      position: absolute;
      right: 17px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .search-results {
      display: grid;
      grid-template-columns: repeat(6, minmax(0,1fr));
      gap: 13px;
    }

    /* =========================
       MATCHES
    ========================== */

    .matches-list {
      display: grid;
      gap: 11px;
    }

    .match-card {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 15px;
      padding: 17px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      transition: .2s;
    }

    .match-card:hover {
      background: var(--surface-2);
      border-color: rgba(255,255,255,.13);
    }

    .team {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
    }

    .team.away {
      justify-content: flex-start;
    }

    .team.home {
      justify-content: flex-end;
      text-align: left;
    }

    .team-logo {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 50%;
      background: var(--surface-3);
      padding: 7px;
    }

    .match-center {
      min-width: 130px;
      text-align: center;
    }

    .match-time {
      font-size: 19px;
      font-weight: 900;
    }

    .match-competition {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .match-status {
      display: inline-block;
      margin-top: 7px;
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--surface-3);
      color: var(--muted);
      font-size: 10px;
    }

    .match-status.live {
      color: white;
      background: #b91c1c;
    }

    /* =========================
       CHANNELS
    ========================== */

    .channel-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 13px;
    }

    .channel-card {
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      cursor: pointer;
      transition: .2s;
    }

    .channel-card:hover {
      transform: translateY(-3px);
      background: var(--surface-2);
    }

    .channel-logo {
      width: 62px;
      height: 62px;
      object-fit: contain;
      border-radius: 12px;
      background: var(--surface-3);
      padding: 10px;
      margin-bottom: 13px;
    }

    .channel-name {
      font-weight: 900;
    }

    .channel-description {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      margin-top: 5px;
    }

    /* =========================
       DETAILS
    ========================== */

    .detail-page {
      padding-bottom: 30px;
    }

    .detail-hero {
      position: relative;
      min-height: 480px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }

    .detail-backdrop {
      position: absolute;
      inset: 0;
      background-position: center;
      background-size: cover;
    }

    .detail-backdrop::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(0deg, var(--bg) 0%, transparent 65%),
        linear-gradient(90deg, rgba(7,9,13,.92), rgba(7,9,13,.2));
    }

    .detail-content {
      position: relative;
      z-index: 2;
      width: min(1200px, 92%);
      margin: auto;
      padding: 55px 0;
    }

    .detail-layout {
      display: flex;
      gap: 25px;
      align-items: flex-end;
    }

    .detail-poster {
      width: 210px;
      flex: 0 0 210px;
      aspect-ratio: 2/3;
      border-radius: 13px;
      object-fit: cover;
      box-shadow: var(--shadow);
    }

    .detail-text {
      max-width: 700px;
    }

    .detail-text h1 {
      font-size: clamp(30px,5vw,55px);
      margin-bottom: 13px;
    }

    .detail-description {
      color: #c1c9d4;
      line-height: 1.9;
      margin: 15px 0;
    }

    .season-select {
      width: 100%;
      max-width: 300px;
      padding: 12px;
      background: var(--surface);
      color: white;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      margin-bottom: 15px;
    }

    .episodes {
      display: grid;
      gap: 8px;
    }

    .episode {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
    }

    .episode-number {
      color: var(--primary-2);
      font-weight: 900;
    }

    /* =========================
       WATCH
    ========================== */

    .watch-page {
      padding: 25px 0 50px;
    }

    .watch-player {
      width: 100%;
      background: #000;
      border-radius: 13px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .video-js {
      width: 100%;
      height: auto;
      aspect-ratio: 16/9;
    }

    .watch-info {
      padding: 20px 0;
    }

    .watch-title {
      font-size: 23px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .watch-description {
      color: var(--muted);
      line-height: 1.8;
    }

    .quality-control {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
      color: var(--muted);
      font-size: 12px;
    }

    .quality-select {
      background: var(--surface);
      color: white;
      border: 1px solid var(--border);
      padding: 7px 10px;
      border-radius: 7px;
    }

    /* =========================
       BOTTOM NAV
    ========================== */

    .bottom-nav {
      position: fixed;
      z-index: 200;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: min(600px, calc(100% - 22px));
      height: var(--nav-height);
      display: grid;
      grid-template-columns: repeat(5,1fr);
      padding: 7px;
      background: rgba(17,23,32,.94);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 15px 45px rgba(0,0,0,.4);
    }

    .nav-item {
      border: 0;
      background: transparent;
      color: #788493;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      transition: .2s;
    }

    .nav-icon {
      font-size: 19px;
    }

    .nav-item.active {
      color: white;
      background: rgba(229,9,20,.14);
    }

    .nav-item.active .nav-icon {
      color: var(--primary-2);
    }

    /* =========================
       EMPTY / SKELETON
    ========================== */

    .empty {
      padding: 55px 20px;
      text-align: center;
      color: var(--muted);
      background: var(--surface);
      border-radius: 13px;
      border: 1px solid var(--border);
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .skeleton {
      aspect-ratio: 2/3;
      border-radius: 11px;
      background:
        linear-gradient(
          90deg,
          #111720 25%,
          #1b2430 37%,
          #111720 63%
        );
      background-size: 400% 100%;
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      0% {
        background-position: 100% 0;
      }
      100% {
        background-position: -100% 0;
      }
    }

    /* =========================
       TOAST
    ========================== */

    .toast {
      position: fixed;
      z-index: 500;
      left: 50%;
      bottom: 95px;
      transform: translate(-50%, 20px);
      background: #202936;
      color: white;
      padding: 11px 16px;
      border-radius: 9px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      box-shadow: var(--shadow);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%,0);
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 1100px) {
      .cards,
      .search-results {
        grid-template-columns: repeat(5, minmax(0,1fr));
      }

      .channel-grid {
        grid-template-columns: repeat(3, minmax(0,1fr));
      }
    }

    @media (max-width: 800px) {
      .cards,
      .search-results {
        grid-template-columns: repeat(4, minmax(0,1fr));
      }

      .channel-grid {
        grid-template-columns: repeat(2, minmax(0,1fr));
      }

      .hero {
        min-height: 470px;
      }

      .detail-poster {
        width: 150px;
        flex-basis: 150px;
      }
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 0 4%;
      }

      .brand {
        font-size: 21px;
      }

      .hero {
        min-height: 510px;
      }

      .hero-bg {
        background:
          linear-gradient(0deg, var(--bg) 5%, rgba(7,9,13,.55) 70%, rgba(7,9,13,.15)),
          url("https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=1200&q=80")
          center/cover;
      }

      .hero-content {
        padding-bottom: 50px;
      }

      .cards,
      .search-results {
        grid-template-columns: repeat(3, minmax(0,1fr));
        gap: 9px;
      }

      .card-title {
        font-size: 12px;
      }

      .card-sub {
        font-size: 10px;
      }

      .match-card {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .team.home,
      .team.away {
        justify-content: center;
        text-align: center;
      }

      .match-center {
        order: -1;
      }

      .detail-layout {
        align-items: flex-start;
      }

      .detail-poster {
        width: 120px;
        flex-basis: 120px;
      }

      .detail-text h1 {
        font-size: 28px;
      }

      .detail-description {
        font-size: 13px;
      }

      .channel-grid {
        grid-template-columns:
