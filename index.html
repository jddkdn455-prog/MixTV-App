<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MixTV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      text-align: center;
    }
    h1 {
      color: #e50914;
      margin: 10px 0;
    }
    .video-container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto 15px auto;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
    }
    .category-title {
      font-size: 18px;
      margin: 15px 0 10px 0;
      text-align: right;
      color: #e50914;
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      max-width: 720px;
      margin: 0 auto;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px 8px;
      font-size: 14px;
      color: #fff;
      cursor: pointer;
      transition: 0.2s;
    }
    .card:active {
      background: #e50914;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <h1>MixTV 📺</h1>

  <div class="video-container">
    <video id="video" controls autoplay></video>
  </div>

  <div class="category-title">الروابط المباشرة المجانية:</div>
  
  <div class="grid">
    <div class="card" onclick="playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">بث تجريبي 1</div>
    <div class="card" onclick="playStream('https://res.cloudinary.com/demo/video/upload/sp_auto/v1556211757/mountain.m3u8')">بث تجريبي 2</div>
  </div>

  <script>
    const video = document.getElementById('video');

    function playStream(url) {
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          video.play();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
      }
    }
  </script>
</body>
</html>
