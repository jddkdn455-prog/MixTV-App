<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MixTV</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #121212; color: #ffffff; padding-bottom: 70px; }
    header { background: #1f1f1f; text-align: center; padding: 15px; font-size: 22px; font-weight: bold; color: #e50914; border-bottom: 1px solid #333; }
    #player-container { display: none; width: 100%; background: #000; position: sticky; top: 0; z-index: 100; }
    video { width: 100%; height: 220px; background: #000; }
    .section { display: none; padding: 15px; }
    .section.active { display: block; }
    .card { background: #1e1e1e; border-radius: 10px; padding: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
    .card-title { font-size: 16px; font-weight: bold; }
    .card-sub { font-size: 13px; color: #aaa; margin-top: 4px; }
    .btn-play { background: #e50914; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    nav { position: fixed; bottom: 0; width: 100%; background: #1f1f1f; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #333; }
    nav button { background: none; border: none; color: #888; font-size: 13px; cursor: pointer; font-weight: bold; }
    nav button.active { color: #e50914; }
  </style>
</head>
<body>

  <header>MixTV 📺</header>

  <div id="player-container">
    <video id="video" controls autoplay></video>
  </div>

  <div id="matches" class="section active"><h2>📅 مباريات اليوم</h2><div id="matches-list">جاري التحميل...</div></div>
  <div id="channels" class="section"><h2>📡 قنوات beIN Sports</h2><div id="channels-list">جاري التحميل...</div></div>
  <div id="movies" class="section"><h2>🎬 الأفلام</h2><div id="movies-list">جاري التحميل...</div></div>
  <div id="series" class="section"><h2>📺 المسلسلات</h2><div id="series-list">جاري التحميل...</div></div>

  <nav>
    <button class="active" onclick="switchTab('matches')">المباريات</button>
    <button onclick="switchTab('channels')">beIN Sports</button>
    <button onclick="switchTab('movies')">الأفلام</button>
    <button onclick="switchTab('series')">المسلسلات</button>
  </nav>

  <script>
    const SUPABASE_URL = "https://svsineweaikyaoxdffpj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_WLr8paTuqBSmkro9VZn9hg_EmoUQnqk";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function playStream(url) {
      const container = document.getElementById('player-container');
      const video = document.getElementById('video');
      container.style.display = 'block';

      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchTab(tabId) {
      document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    async function loadData() {
      const { data: matches } = await _supabase.from('matches').select('*');
      document.getElementById('matches-list').innerHTML = matches?.map(m => `
        <div class="card">
          <div><div class="card-title">${m.title}</div><div class="card-sub">⏰ ${m.time || ''}</div></div>
          <button class="btn-play" onclick="playStream('${m.stream_url}')">شاهد الآن</button>
        </div>
      `).join('') || 'لا توجد مباريات حالياً';

      const { data: channels } = await _supabase.from('channels').select('*');
      document.getElementById('channels-list').innerHTML = channels?.map(c => `
        <div class="card">
          <div><div class="card-title">${c.name}</div><div class="card-sub">${c.category}</div></div>
          <button class="btn-play" onclick="playStream('${c.stream_url}')">تشغيل</button>
        </div>
      `).join('') || 'لا توجد قنوات حالياً';

      const { data: movies } = await _supabase.from('movies').select('*');
      document.getElementById('movies-list').innerHTML = movies?.map(m => `
        <div class="card">
          <div><div class="card-title">${m.title}</div><div class="card-sub">${m.category}</div></div>
          <button class="btn-play" onclick="playStream('${m.video_url}')">عرض</button>
        </div>
      `).join('') || 'لا توجد أفلام حالياً';

      const { data: series } = await _supabase.from('series').select('*');
      document.getElementById('series-list').innerHTML = series?.map(s => `
        <div class="card">
          <div><div class="card-title">${s.title}</div><div class="card-sub">${s.category}</div></div>
          <button class="btn-play" onclick="playStream('${s.video_url}')">عرض</button>
        </div>
      `).join('') || 'لا توجد مسلسلات حالياً';
    }

    loadData();
  </script>
</body>
</html>
