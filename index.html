<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MixTV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f0f0f; color: #fff; padding-bottom: 40px; }
        header { background: #181818; padding: 15px; text-align: center; font-size: 22px; font-weight: bold; color: #e50914; border-bottom: 2px solid #e50914; }
        .player-container { width: 100%; max-width: 900px; margin: 0 auto; background: #000; aspect-ratio: 16/9; position: sticky; top: 0; z-index: 100; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .section-title { margin: 20px 15px 10px; font-size: 18px; color: #e50914; border-right: 4px solid #e50914; padding-right: 8px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; padding: 0 15px; }
        .card { background: #1f1f1f; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; border: 1px solid #2a2a2a; }
        .card:hover { border-color: #e50914; }
        .card img { width: 100%; height: 100px; object-fit: contain; border-radius: 6px; margin-bottom: 6px; }
        .card p { font-size: 12px; color: #eee; font-weight: 500; }
        .match-card { background: #1f1f1f; border-radius: 8px; padding: 12px 15px; margin: 0 15px 10px; display: flex; justify-content: space-between; align-items: center; border-right: 4px solid #e50914; cursor: pointer; }
        .team { font-weight: bold; font-size: 14px; }
        .time { background: #e50914; color: white; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>

    <header>📺 MixTV</header>

    <div class="player-container">
        <video id="videoPlayer" controls autoplay poster="https://via.placeholder.com/800x450/000000/FFFFFF?text=اختر+قناة+أو+مباراة"></video>
    </div>

    <!-- 1. جدول المباريات -->
    <div class="section-title">مباريات اليوم المباشرة</div>
    <div class="match-card" onclick="playStream('https://v1.tv96.tv/live/bein1/index.m3u8')">
        <span class="team">⚽ مباراة اليوم المباشرة (beIN 1)</span>
        <span class="time">مباشر الآن</span>
    </div>

    <!-- 2. قنوات beIN Sports -->
    <div class="section-title">قنوات beIN Sports</div>
    <div class="grid">
        <div class="card" onclick="playStream('https://v1.tv96.tv/live/bein1/index.m3u8')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/20/BeIN_Sports_logo.svg" alt="beIN 1">
            <p>beIN Sports 1 HD</p>
        </div>
        <div class="card" onclick="playStream('https://v1.tv96.tv/live/bein2/index.m3u8')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/20/BeIN_Sports_logo.svg" alt="beIN 2">
            <p>beIN Sports 2 HD</p>
        </div>
        <div class="card" onclick="playStream('https://v1.tv96.tv/live/bein3/index.m3u8')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/20/BeIN_Sports_logo.svg" alt="beIN 3">
            <p>beIN Sports 3 HD</p>
        </div>
    </div>

    <!-- 3. قسم الأفلام -->
    <div class="section-title">قسم الأفلام</div>
    <div class="grid">
        <div class="card" onclick="playStream('ضع_رابط_الفيلم_هنا')">
            <img src="https://via.placeholder.com/150x200/222222/ffffff?text=Movie" alt="فيلم">
            <p>فيلم جديد</p>
        </div>
    </div>

    <!-- 4. قسم المسلسلات -->
    <div class="section-title">قسم المسلسلات</div>
    <div class="grid">
        <div class="card" onclick="playStream('ضع_رابط_المسلسل_هنا')">
            <img src="https://via.placeholder.com/150x200/333333/ffffff?text=Series" alt="مسلسل">
            <p>مسلسل جديد - الحلقة 1</p>
        </div>
    </div>

    <script>
        function playStream(url) {
            var video = document.getElementById('videoPlayer');
            if (Hls.isSupported()) {
                var hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play();
            } else {
                video.src = url;
                video.play();
            }
        }
    </script>
</body>
      </html>
