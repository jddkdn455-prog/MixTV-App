<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MixTV - البث المباشر</title>
  <!-- Video.js Stylesheet -->
  <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #1e293b;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    .container {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 1.5rem;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .container {
        flex-direction: row;
      }
    }

    .player-section {
      flex: 3;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .video-container {
      width: 100%;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    .video-js {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
    }

    .channel-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #e2e8f0;
      background-color: #1e293b;
      padding: 1rem;
      border-radius: 8px;
    }

    .playlist-section {
      flex: 1;
      background-color: #1e293b;
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: 600px;
      overflow-y: auto;
    }

    .playlist-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #38bdf8;
      border-bottom: 2px solid #334155;
      padding-bottom: 0.5rem;
    }

    .channel-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .channel-item {
      padding: 0.8rem 1rem;
      background-color: #334155;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .channel-item:hover {
      background-color: #475569;
      transform: translateY(-2px);
    }

    .channel-item.active {
      background-color: #0284c7;
      color: #fff;
    }

    .badge {
      font-size: 0.75rem;
      background-color: #0f172a;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">MixTV</div>
  </header>

  <div class="container">
    <!-- مشغل الفيديو -->
    <div class="player-section">
      <div class="video-container">
        <video id="main-player" class="video-js vjs-big-play-centered" controls preload="auto">
          <source src="https://live-hls-apps-aja-fa.getaj.net/AJA/01.m3u8" type="application/x-mpegURL">
          متصفحك لا يدعم تشغيل الفيديو.
        </video>
      </div>
      <div class="channel-title" id="current-channel-name">قناة الجزيرة الإخبارية (1080p)</div>
    </div>

    <!-- قائمة القنوات -->
    <div class="playlist-section">
      <div class="playlist-title">قائمة القنوات الحية</div>
      <ul class="channel-list">
        <li class="channel-item active" onclick="playChannel('https://live-hls-apps-aja-fa.getaj.net/AJA/01.m3u8', 'قناة الجزيرة الإخبارية (1080p)', this)">
          <span>قناة الجزيرة الإخبارية</span>
          <span class="badge">1080p</span>
        </li>
        <li class="channel-item" onclick="playChannel('https://live.kwikmotion.com/alaraby1live/alaraby_abr/playlist.m3u8', 'التلفزيون العربي (1080p)', this)">
          <span>التلفزيون العربي</span>
          <span class="badge">1080p</span>
        </li>
        <li class="channel-item" onclick="playChannel('https://live.kwikmotion.com/alaraby2live/alaraby2.smil/playlist.m3u8', 'التلفزيون العربي 2 (1080p)', this)">
          <span>التلفزيون العربي 2</span>
          <span class="badge">1080p</span>
        </li>
      </ul>
    </div>
  </div>

  <!-- Video.js JavaScript -->
  <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
  <script>
    const player = videojs('main-player');

    function playChannel(url, name, element) {
      player.src({
        src: url,
        type: 'application/x-mpegURL'
      });
      player.play();

      document.getElementById('current-channel-name').innerText = name;

      const items = document.querySelectorAll('.channel-item');
      items.forEach(item => item.classList.remove('active'));
      element.classList.add('active');
    }
  </script>
</body>
  </html>
